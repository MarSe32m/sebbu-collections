name: Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
         - tag: 6.4.0-RELEASE
           branch: swift-6.4.0-release
           
    steps:
    - uses: compnerd/gha-setup-swift@main
      with:
        branch: ${{ matrix.branch }}
        tag: ${{ matrix.tag }}
    - uses: actions/checkout@v3
    
    - name: Swift Version
      run: swift --version
      
    - name: Build (Debug)
      run: swift build -c debug
      
    - name: Build (Release)
      run: swift build -c release
      
    - name: Test (Debug)
      run: swift test -c debug
      
    - name: Test (Release)
      run: swift test -c release
